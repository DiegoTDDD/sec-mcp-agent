[project]
name = "sec-mcp-agent"
version = "1.0.0"
description = "MCP servers over SEC 10-K filings and a fraud model, and a local tool-calling agent with verified citations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.10",
    "rank-bm25>=0.2.2",
    "ollama>=0.6",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "joblib>=1.4",
]

[project.optional-dependencies]
data = ["edgartools==5.40.1", "pyarrow>=17"]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["sec_mcp_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20", "RUF", "ANN"]
ignore = ["ANN401", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"scripts/**" = ["T20"]
"scripts/run_eval.py" = ["T20", "E501"]  # markdown table rows
